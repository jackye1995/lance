[package]
name = "mem-wal-kv-reference"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
rocksdb = { version = "0.23", default-features = false }
serde_json = "1"
slatedb = { version = "=0.16.0", default-features = false, features = ["aws"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
debug = 1

